<!DOCTYPE html>
<!--
  Vivodepot — Lese-App (Empfänger-Workflow)
  Komponente 2 der Vier-Komponenten-Architektur (ADR-098). Eigenständige Single-File-HTML.
  READ-ONLY: liest ein zugesandtes Depot oder einen QR-Code, schreibt NIE, hält keine Daten
  zwischen Sessions. Kein localStorage/sessionStorage/IndexedDB/Cookies. Keine Netz-Zugriffe.
  Der VdCrypto-Block (Script 1) ist byte-identisch zur Bürger-App (Hash f0f88502…); der JWS-Block
  + Test-Sentinel ebenso. Alle Bibliotheken inline. Kein Kamera-Scan (U2-ADR-085 §5: ersatzlos
  entfernt, kein Erzeuger mehr nach CC-01/CC-08) — Datei-Öffnen und QR-Text-Einfügen sind die
  beiden Eingangswege.
-->

  <title>Vivodepot · Lesen</title>
  <style>
    /* ════════════════════════════════════════════════════════════════════════
       DIE FARBWELT DER LESE-APP FOLGT SEIT 17.08.2026 DEN KERN-TOKEN.
       ────────────────────────────────────────────────────────────────────────
       DER ANLASS: `--akzent` trug `#3d5a2a` — bitgenau den alten `--forest`-Wert,
       den die Entscheidung vom 05.08.2026 abgelöst hat. Im Kern kommt er seither
       NULL Mal vor. Hier hat er überlebt, weil er unter einem anderen NAMEN steht:
       jede Suche nach „forest" ging an ihm vorbei. Gefunden wurde er erst, als
       jemand nach dem WERT statt nach dem Namen suchte (Nachtkette 17.08., 10c).

       DIE NAMEN BLEIBEN. Die Lese-App ist eine eigene Anwendung mit eigener,
       schlanker Benennung (`--tinte` statt `--ink`); sie umzubenennen wäre ein
       zweiter Umbau ohne Gewinn. Angeglichen sind die WERTE.

       JEDER WERT IST GEMESSEN (`tools/lib/kontrast.js`), nicht übernommen —
       gegen BEIDE Hintergründe, auf die er trifft:
         --akzent       #4F6539  6.46 auf --flaeche · 6.25 auf --flaeche-warm
         --tinte        #1c2a1e  15.01 auf --flaeche
         --tinte-weich  #4a5e4f  6.99 auf --flaeche
         --leer         #637568  4.91 auf --flaeche · 4.75 auf --flaeche-warm

       WAS NICHT ANGEGLICHEN WURDE, UND WARUM — keine stille Auslassung:
       `--warn-bg`/`--warn-tinte` bleiben. Das Kern-Paar `--gold` auf `--gold-soft`
       misst **4.31** und liegt damit UNTER AA; das hiesige Paar misst 5.82. Der
       Kern nutzt Gold nicht als Fließtext auf Gold-Grund, die Lese-App tut es
       (`.klartext-warn`). Angleichen hiesse hier, Kontrast gegen Konsistenz zu
       tauschen.

       Zum abgelösten `--leer`-Wert: er war bis 13.08. `#9aa0a6` (2.64:1, 197
       axe-Knoten über 22 Sichten). Die damalige Wahl `#6b6f73` löste das; der
       Kern-Token `--ink3` löst es ebenso und ist zusätzlich derselbe Wert wie im
       Kern. Die Tönung wandert dabei von kühlem Grau nach Salbei-Grau — das war
       eine Eigenschaft der damaligen Lösung, nicht ihr Ziel.
       ════════════════════════════════════════════════════════════════════════ */
    :root {
      --akzent: #4F6539;          /* Kern --salbei-dunkel */
      --tinte: #1c2a1e;           /* Kern --ink */
      --tinte-weich: #4a5e4f;     /* Kern --ink2 */
      --linie: #d8d2c4;           /* Kern --line */
      --flaeche: #ffffff;         /* Kern --white */
      --flaeche-warm: #fdfbf7;    /* Kern --papier-bereich */
      --leer: #637568;            /* Kern --ink3 */
      --warn-bg: #fff4e5;         /* bewusst eigen, s. Kopf */
      --warn-tinte: #8a5300;      /* bewusst eigen, s. Kopf */
      /* A318 Zug 2: die Zertifikatsmarke braucht einen Ton fuer „traegt nicht".
         WOERTLICHER SPIEGEL DES KERNS (--error / --fehler-flaeche), nicht neu gewaehlt:
         #c0392b auf #fdecea misst 4.76:1 (AA). Ein eigener Rotton haette hier eine
         zweite Farbentscheidung ueber dieselbe Sache eroeffnet. */
      --fehler: #c0392b;          /* Kern --error */
      --fehler-flaeche: #fdecea;  /* Kern --fehler-flaeche */
      /* Nachtrag „Alles anpassbar" (17.08.2026): tokenisiert, NICHT umgefaerbt.
         Die Kamera-Flaeche ist schwarz, damit das Bild nicht auf hellem Grund
         flackert, bevor der Datenstrom steht — ein Modul darf das aendern. */
      --kamera-flaeche: #000;
    }

    .app-shell { min-height: 100vh; display: flex; flex-direction: column; }

    .klartext-warn { background: var(--warn-bg); color: var(--warn-tinte); padding: 10px 22px; font-size: .9rem; }
    /* A318 Zug 2 — die Zertifikatsmarke am Abschnitt einer angedockten Vorlage.
       DER ZUSTAND STEHT IM TEXT, nicht nur in der Farbe (WCAG 1.4.1): die vier Saetze

    .vorlage-marke {

    .shell-body { flex: 1; display: flex; min-height: 0; }
    .shell-einzel { justify-content: center; }
    .sidebar {
      width: 252px; flex-shrink: 0; background: var(--flaeche); border-right: 1px solid var(--linie);

    }

    .content { flex: 1; overflow-y: auto; padding: 28px 34px; }
    .bereich { max-width: 720px; }
    .bereich-kopf h2 { margin: 0 0 4px; font-size: 1.4rem; }

    /* ── Notfall-Sicht ─────────────────────────────────────── */

  <div id="app"></div>
  <script>
/* ════════════════════════════════════════════════════════════════════════
   ANMERKUNG SP — kein Code, sondern Hinweis für den Bau (29.05.2026)

   Dies ist die geprüfte Krypto-Kern-Schicht, WÖRTLICH aus VIVODEPOT.html
   (Schema 19) extrahiert. Sie ist NICHT neu zu generieren — sie ist zu
   portieren. Gib sie dem bauenden Modell als fertigen, unveränderlichen
   Block mit und lass es Hülle, Datenmodell, Modus und Design darum herum
   bauen.

   Regeln für das bauende Modell:
   • Diese Funktionen NICHT umschreiben, umbenennen oder "verbessern".
   • Die einzige nach außen gedachte API ist das Objekt VdCrypto am Ende:
       VdCrypto.setupSession(passwort, saltBytes)  -> Promise<void>
       VdCrypto.encryptDepot(obj, key, aad?)       -> Promise<{iv, ct}>
       VdCrypto.decryptDepot(stored, key, aad?)    -> Promise<obj>
   • Verschlüsselungs-Parameter sind in den AAD-Blöcken gebunden — beim
     Entschlüsseln dieselbe AAD übergeben, sonst schlägt GCM fehl (das ist
     gewollt: Manipulations- und Falschpasswort-Erkennung).
   • Klartext wird NIE auf den Stick geschrieben. removePassword() existiert
     nicht und darf nicht entstehen.

   Herkunft (Zeilen in VIVODEPOT.html):
     Konstanten            13610–13616, 14138–14151
     Modul-Zustand         14153, 14164–14165
     deriveMasterBits      14285–14295
     importMasterAesKey    14298–14303
     importMasterHkdfKey   14306–14310
     deriveKey             14218–14226
     deriveKeyLegacy       14229–14238
     encryptData           14240–14250
     decryptData           14252–14259
     deriveSubKey (v1)     14317–14331
     deriveDepotKeyV2      14344–14364
     _deriveHkdfRaw (Test) 14371–14382
     base64-Helfer         14386–14392
     setupMasterSession    14406–14411
     VdCrypto-Surface      14437–14442

   Nicht in diesem Block (kommen mit den jeweiligen Modulen):
     • Angehörigen-Krypto (eigener Salt/IV, Klasse-A-Trennung, ADR-052)
       → gehört zum Übergaben-Modul (ca. Z. 14444 ff.).
     • _verifyJWS (in der VdCrypto-Surface referenziert) → gehört zur
       VC-/Issuer-Schicht. Solange kein VC-Modul andockt, kann der Verweis
       auf verifyJWS in der Surface entfallen oder auf eine Stub-Funktion
       zeigen.
   ════════════════════════════════════════════════════════════════════════ */


/* ── Konstanten ───────────────────────────────────────────────────────── */

// Check if encryption is available
const CRYPTO_AVAILABLE = !!(window.crypto && window.crypto.subtle);

// AP1-Krypto-Aufrüstung: Iterationszahl als Konstante (OWASP PBKDF2-HMAC-SHA256 Empfehlung 2024)
const PBKDF2_ITERATIONS = 600000;
// B2/v3 (2026-06-12): Legacy-200k-Pfad ersatzlos entfernt (deriveKeyLegacy + PBKDF2_ITERATIONS_LEGACY).

const HKDF_INFO_SUBDEPOT_V1   = 'vivodepot-subdepot-v1';
// KRYPTO-KRITISCH (B2/v3): EIN Domain-Sep-Pfad für Anker UND Sub (ADR-068 v2: „Anker IST ein Depot").
// Identifier-Name als stabiles Label belassen (in Hülle/Tests verdrahtet); Krypto-Generation = v3.
// Domain-separiert/präfixfrei: 'vivodepot/v3/depot/' + depotUUID. Kein String ist Präfix eines anderen.
const HKDF_INFO_DEPOT_V2_PREFIX = 'vivodepot/v3/depot/';
const HKDF_HASH = 'SHA-256';
const HKDF_KEY_LENGTH_BITS = 256;
const SUBDEPOT_CRYPTO_SALT_LENGTH_BYTES = 32;
const CRYPTO_VERSION_AKTUELL = 3; // B2/v3 (2026-06-12): Schlüsseltrennung — PBKDF2-Bits nur noch HKDF-Eingang; war 2.
// ADR-085-Nachtrag: Harte Allowlist — kein Try-Catch-Fallback für unbekannte Versionen.
// B2/v3 (2026-06-12): Release ist v3-only. Keine Lese-Pfade für v1/v2 mehr.
/* ZERFALL IN FELD-EINHEITEN (18.08.2026) — Krypto-Generation 4.
   `KRYPTO_VERSION_ALLOWLIST` trägt BEIDE: v3 ist nicht nur der Migrationsweg, sondern der
   RÜCKWEG, falls sich der Zerfall als falsch erweist. Er wird nicht entfernt, und wer ihn
   entfernen will, braucht dafür eine eigene Entscheidung (Auflage A2 zum Bauauftrag).
   Warum die Version überhaupt steigt, und das ist keine Wahl, sondern eine Folge: eine
   zerfallene Datei mit `kryptoVersion: 3` käme durch das Gate und scheiterte danach — ein
   verwirrender Fehler statt eines klaren. */
const CRYPTO_VERSION_ZERFALL = 4;
const KRYPTO_VERSION_ALLOWLIST = [3, 4];
// ADR-085-Nachtrag: AAD-Blöcke für AES-GCM-Bindung der Krypto-Parameter.
// Depot-Pfad (HKDF-abgeleitete Sub-Keys): kdfTyp 'hkdf-sha256'.
// Übergabe-Pfad (direkter PBKDF2-Schlüssel): kdfTyp 'pbkdf2-sha256'.
// Identifier-Namen (_AAD_*_V2) als stabile Labels belassen; kryptoVersion-Feld = 3.
const _AAD_DEPOT_V2 = Object.freeze({ kryptoVersion: 3, iterationen: PBKDF2_ITERATIONS, kdfTyp: 'hkdf-sha256' });
const _AAD_UEBERGABE_V2 = Object.freeze({ kryptoVersion: 3, iterationen: PBKDF2_ITERATIONS, kdfTyp: 'pbkdf2-sha256' });


/* ── Modul-Zustand (Session-only, NIE persistieren) ───────────────────── */

let sessionKey = null;
// AP 5.2 (ADR-052): Master-Schlüssel-Doppel-Repräsentation und Salt-Speicher.
let sessionHkdfKey = null;
let storedPbkdf2Salt = null;


/* ── Master-Bit-Ableitung und Schlüssel-Import ────────────────────────── */

// PBKDF2-600k → 256 raw bits (ArrayBuffer). Wird zwei Mal verwendet
// (importMasterAesKey + importMasterHkdfKey), danach defensiv überschrieben.
async function deriveMasterBits(password, salt) {
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey(
    'raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']
  );
  return crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt, iterations: PBKDF2_ITERATIONS, hash: 'SHA-256' },
    km,
    HKDF_KEY_LENGTH_BITS
  );
}

// Bits → AES-GCM-CryptoKey für ankerPerson-Verschlüsselung.
async function importMasterAesKey(bits) {
  return crypto.subtle.importKey(
    'raw', bits, { name: 'AES-GCM', length: HKDF_KEY_LENGTH_BITS },
    false, ['encrypt', 'decrypt']
  );
}

// Bits → HKDF-CryptoKey für Sub-Schlüssel-Ableitung (RFC 5869).
async function importMasterHkdfKey(bits) {
  return crypto.subtle.importKey(
    'raw', bits, { name: 'HKDF' }, false, ['deriveKey', 'deriveBits']
  );
}


/* ── deriveKey (Übergabe-Pfad, PBKDF2-600k → AES; Design, NICHT Legacy) ── */

// B2-Abgrenzung: Dieser direkte PBKDF2→AES-Pfad bleibt für Übergabe-Container
// (Empfänger ohne HKDF-Wurzel), inkl. AAD-kdfTyp 'pbkdf2-sha256'. Er ist die
// EINZIGE legitime Direkt-Bit→AES-Verwendung; der Session-/Anker-Pfad nutzt
// ausschließlich HKDF (Schlüsseltrennung).
async function deriveKey(password, salt) {
  // AP 5.2 (ADR-052, Plan §1.7): intern auf zwei-Schritt-Sequenz umgestellt
  // (deriveMasterBits + importMasterAesKey), Signatur unverändert. Funktional
  // identisch zur Beta-17-Implementation.
  const bits = await deriveMasterBits(password, salt);
  return importMasterAesKey(bits);
}

// B2/v3 (2026-06-12): deriveKeyLegacy (200k) ersatzlos entfernt — v3-only Release.


/* ── encryptData / decryptData (AES-256-GCM, optionaler AAD-Block) ────── */

// S17 (CC-Auftrag „Die Base64-Grenzen", 09.08.2026): Array.from+join legte für jedes
// Ciphertext-Byte ein eigenes Ein-Zeichen-String-Objekt an. Bei einem ~90-100 MB großen
// Depot (im Alltag erreichbar — z. B. zwanzig Fotos üblicher Handygröße in der Mappe)
// schlug das fehl: RangeError „Invalid array length" (gemessen: Chromium/Node ab ~129 MB;
// Firefox ab ~270 MB, dort als rohe Zeichenkette "out of memory" geworfen, kein
// Error-Objekt). Blockweise Umwandlung ist byte-identisch zum alten Verfahren (belegt:
// tests/vdcrypto-block-base64-chunking.test.js) und übersteht denselben Kipppunkt.
function _bytesAlsBinaerstring(bytes) {
  const CHUNK = 8192;
  const teile = [];
  for (let i = 0; i < bytes.length; i += CHUNK) teile.push(String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK)));
  return teile.join('');
}

async function encryptData(obj, key, aad = null) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder();
  const params = { name: 'AES-GCM', iv };
  if (aad !== null) params.additionalData = new TextEncoder().encode(JSON.stringify(aad));
  const ciphertext = await crypto.subtle.encrypt(params, key, enc.encode(JSON.stringify(obj)));
  return {
    iv: btoa(String.fromCharCode(...iv)),
    ct: btoa(_bytesAlsBinaerstring(new Uint8Array(ciphertext)))
  };
}

async function decryptData(stored, key, aad = null) {
  const iv = Uint8Array.from(atob(stored.iv), c=>c.charCodeAt(0));
  const ct = Uint8Array.from(atob(stored.ct), c=>c.charCodeAt(0));
  const params = { name: 'AES-GCM', iv };
  if (aad !== null) params.additionalData = new TextEncoder().encode(JSON.stringify(aad));
  const plain = await crypto.subtle.decrypt(params, key, ct);
  return JSON.parse(new TextDecoder().decode(plain));
}


/* ── Sub-Schlüssel-Ableitung (HKDF) — für Sub-Depots / Übergaben ──────── */

// HKDF mit fest codiertem Info-String → AES-GCM-Sub-Key für ein Sub-Depot.
// HISTORISCH (cryptoVersion 1): kein aktiver Aufrufer; v1-Container werden im

  return !!(jwk && jwk.kty === 'OKP' && jwk.crv === 'Ed25519'
            && jwk.x === TEST_SENTINEL_PUBLIC_JWK.x);
}

/* ── Die Prüfkette des Empfängers (A318 Zug 2) ────────────────────────────────────
   ZWEI STUFEN, wie im Kern und aus demselben Grund: das Zertifikat attestiert den
   Anbieter-Schlüssel, das signierte Template attestiert die Feldliste. Der
   Anbieter-Public-Key steckt AUSSCHLIESSLICH im Zertifikat — ohne das Zertifikat ist
   das Template nicht prüfbar, ohne das Template hat das Zertifikat nichts zu
   attestieren (gemessen im Kern, A345).

   DIE WIDERRUFSLISTE (A405 Zug 2, 21.08.2026). Bis heute fehlte sie hier, und die Begründung
   trug: eine zweite, danebengepflegte Kopie liefe auseinander, und eine leere Kopie sähe aus
   wie eine Prüfung. **Beides gilt für eine HANDGEPFLEGTE Kopie. Für eine ERZEUGTE gilt es
   nicht** — sie kann nicht auseinanderlaufen, weil ein `--check` im `pre-commit` das verbietet.
   Dasselbe Muster wie `bereiche.json`, der Torwächter des Empfängers und der JWS-Block.

   Die Liste steht darum unten in einer markierten Region, geschrieben von
   `tools/build-widerrufsliste.js` aus `WIDERRUFS_LISTE` des Kerns. Sie ist heute leer — und das
   ist jetzt eine ERZEUGTE Leere, keine vergessene. */
/* WIDERRUFSLISTE:BEGIN — generierter Bereich (tools/build-widerrufsliste.js); Quelle: vivodepot.html WIDERRUFS_LISTE */
const WIDERRUFS_LISTE = Object.freeze([]);   // RFC-7638-Thumbprints widerrufener Anbieter-Schluessel
/* WIDERRUFSLISTE:END */

/* RFC-7638-Thumbprint eines JWK. WORT FÜR WORT derselbe wie im Kern (`_jwkThumbprint`) — eine
   zweite, hier anders gerechnete Form ergäbe andere Abdrücke, und die Liste ginge ins Leere.
   Er steht hier als CODE und nicht in der erzeugten Region: erzeugt wird die Liste, nicht der
   Weg, sie zu lesen. */
function _kanonischJSON(x) {
  if (Array.isArray(x)) return '[' + x.map(_kanonischJSON).join(',') + ']';
  if (x && typeof x === 'object') {
    return '{' + Object.keys(x).sort().map((k) => JSON.stringify(k) + ':' + _kanonischJSON(x[k])).join(',') + '}';
  }
  return JSON.stringify(x === undefined ? null : x);
}
async function _jwkThumbprint(jwk) {
  if (!jwk || !jwk.kty) return '';
  let m;
  if (jwk.kty === 'OKP')      m = { crv: jwk.crv, kty: jwk.kty, x: jwk.x };
  else if (jwk.kty === 'EC')  m = { crv: jwk.crv, kty: jwk.kty, x: jwk.x, y: jwk.y };
  else if (jwk.kty === 'RSA') m = { e: jwk.e, kty: jwk.kty, n: jwk.n };
  else                        m = { kty: jwk.kty };
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(_kanonischJSON(m)));
  return _jwsB64uFromBytes(new Uint8Array(buf));
}

async function verifiziereProviderCredential(jwsCompact, opts) {
  const anker = (opts && opts.ankerJwk) || TRUST_AUTHORITY_PUBLIC_JWK;
  const ankerKey = await _jwsImportVerifyKey(anker);
  const res = await _verifyJWS(jwsCompact, ankerKey, opts);
  res.istTestAnker = (anker.x === TEST_SENTINEL_PUBLIC_JWK.x);
  /* A405 Zug 2: derselbe Griff wie im Kern (`_verifyJWS` dort), an derselben Stelle der Kette —
     die Signatur wird VOR dem Ablauf geprüft, damit ein widerrufenes UND abgelaufenes Zertifikat
     als widerrufen benannt wird und nicht bloss als abgelaufen.
     `opts.widerrufsListe` ist app-kontrolliert (wie `opts.ankerJwk`, nie aus dem Credential) —
     Test-Injektion, kein zweiter Kanal. */
  const _wListe = (opts && opts.widerrufsListe) || WIDERRUFS_LISTE;
  if (_wListe.length && (res.gueltig || res.abgelaufen) && res.nutzlast) {
    /* Auch bei ABGELAUFENEN Zertifikaten — Widerruf schlägt Schonfrist, genau wie im Kern.
       Sonst käme ein widerrufenes UND abgelaufenes Cert über die Schonfrist zurück. */
    const cs = res.nutzlast.credentialSubject || (res.nutzlast.vc && res.nutzlast.vc.credentialSubject) || {};
    if (cs.publicKeyJwk) {
      const tp = await _jwkThumbprint(cs.publicKeyJwk);
      if (tp && _wListe.indexOf(tp) !== -1) { res.gueltig = false; res.widerrufen = true; res.grund = 'JWS: Anbieter widerrufen'; }
    }
  }
  return res;
}

async function _verifiziereTemplateSignatur(certNutzlast, templateJws, opts) {
  const cs = (certNutzlast && (certNutzlast.credentialSubject
    || (certNutzlast.vc && certNutzlast.vc.credentialSubject))) || {};
  const anbieterJwk = cs.publicKeyJwk;
  if (!anbieterJwk) return { gueltig: false, grund: 'Template signiert, aber kein Anbieter-Key (publicKeyJwk) im Zertifikat' };
  let key;
  try { key = await _jwsImportVerifyKey(anbieterJwk); }
  catch (e) { return { gueltig: false, grund: 'Anbieter-Key nicht lesbar: ' + e.message }; }
  const res = await _verifyJWS(templateJws, key, opts);
  res.anbieterName = cs.name || cs.anbieterName || null;
  return res;
}

/* Die ganze Kette. Ergebnisform wie im Kern: `gueltig`, `abgelaufen`, `templateOk`.
   DIE SCHONFRIST DES KERNS IST HIER NICHT NACHGEBAUT: dort entscheidet der Aufrufer
   (nur für die eingebauten Basis-Vorlagen) über einen Marker. Der Empfänger hat diesen
   Fall nicht — er bekommt fertige Belege und sagt, was er sieht. Ein abgelaufenes
   Zertifikat wird darum als ABGELAUFEN gemeldet und nicht als gültig, und die
   Template-Stufe wird trotzdem gerechnet, damit „abgelaufen" nicht mit „manipuliert"
   zusammenfällt. */
async function verifiziereTemplateKette(certJws, templateJws, opts) {
  let certRes;
  try { certRes = await verifiziereProviderCredential(certJws, opts); }
  catch (e) { return { gueltig: false, grund: 'Cert-Prüf-Fehler: ' + e.message }; }
  const certAblauf = (certRes && certRes.nutzlast
    && (certRes.nutzlast.expirationDate || certRes.nutzlast.validUntil)) || null;
  if (certRes && !certRes.gueltig && certRes.abgelaufen && certRes.nutzlast) {
    const t = await _verifiziereTemplateSignatur(certRes.nutzlast, templateJws, opts);
    return Object.assign({}, t, { gueltig: false, abgelaufen: true, templateOk: !!t.gueltig, certAblauf: certAblauf });
  }
  if (!certRes || !certRes.gueltig) {
    return { gueltig: false, grund: 'Cert ungültig: ' + ((certRes && certRes.grund) || ''),
             abgelaufen: !!(certRes && certRes.abgelaufen) };
  }
  return Object.assign({}, await _verifiziereTemplateSignatur(certRes.nutzlast, templateJws, opts),
    { certAblauf: certAblauf });
}

/* ── Der Prüfstand: welcher Zustand gilt für welches angedockte Feld ───────────────
   VIER ZUSTÄNDE, und der Auftrag nennt den Grund für den vierten: „nicht prüfbar" darf
   weder wie „gültig" noch wie „ungültig" aussehen. Ein Bestandseintrag ohne Beleg ist
   nicht verdächtig — er stammt aus einer Zeit vor Schema 66. Ein manipulierter Beleg
   dagegen ist eine Aussage, und sie muss anders lauten.

     'gueltig'      — Zertifikat und Template-Signatur tragen.
     'abgelaufen'   — Signatur trägt, das Zertifikat ist über seine Gültigkeit hinaus.
     'ungueltig'    — die Signatur trägt NICHT (manipuliert, falscher Anker, kaputt).
     'nicht-pruefbar' — kein Beleg im Depot (Bestandseintrag) oder kein Eintrag zum Feld.

   Rein und ohne UI; wirft nie. Der Rückgabewert ist eine Karte feldId -> Stand, damit
   die Anzeige sie ohne zweite Auflösung lesen kann. */
async function vorlagenPruefstandBerechnen(depot, opts) {
  const karte = Object.create(null);
  const eintraege = (depot && Array.isArray(depot.importierteVorlagen)) ? depot.importierteVorlagen : [];
  for (const v of eintraege) {
    if (!v || typeof v !== 'object') continue;
    const felder = Array.isArray(v.feldIds) ? v.feldIds : [];
    let stand;
    if (!v.beleg || !v.beleg.providerCredentialJws || !v.beleg.templateJws) {
      stand = { zustand: 'nicht-pruefbar', grund: 'kein-beleg', anbieter: v.anbieterName || null };
    } else {
      let r = null;
      try { r = await verifiziereTemplateKette(v.beleg.providerCredentialJws, v.beleg.templateJws, opts); }
      catch (e) { r = { gueltig: false, grund: 'Prüf-Fehler: ' + (e && e.message) }; }
      const anbieter = (r && r.anbieterName) || v.anbieterName || null;
      if (r && r.gueltig) stand = { zustand: 'gueltig', anbieter: anbieter, bis: r.certAblauf || null };
      else if (r && r.abgelaufen && r.templateOk) stand = { zustand: 'abgelaufen', anbieter: anbieter, bis: r.certAblauf || null };
      else stand = { zustand: 'ungueltig', anbieter: anbieter, grund: (r && r.grund) || null };
    }
    for (const fid of felder) karte[fid] = stand;
    if (v.id) karte['vorlage:' + v.id] = stand;
  }
  return karte;
}

   Satz heute bedienen kann, sind die der Zeichenketten-Tabelle (`strings:<schlüssel>.text`) —
   genau der Raum, den auch der Kern heute bedient. Die Beschriftungen der Bereiche, Sektionen
   und Felder tragen in BEIDEN Anwendungen noch keine Kennung; das ist Gegenstand des Hebens in
   Tranchen und wird hier nicht vorweggenommen.

   WARUM DIE PRÜFUNG NICHT AUS DEM KERN KOPIERT IST: die Lese-App hat keinen eingebauten
   Textsatz-Katalog. Ihr bekannter Kennungsraum ist ihre EIGENE Tabelle — eine kopierte
   Katalogliste wäre ein zweites Register über dieselbe Sache und liefe auseinander. */
const TEXTSATZ_SPRACHE_EINGEBAUT = 'de';
let _TEXTSATZ_MODUL_REGISTRY = Object.create(null);
let _TEXTSATZ_MODUL_SPRACHE = null;
// A479 — die Regeln je Sprache, getrennt von der Text-Registry (dieselbe Trennung wie im Kern
// vor Glied 4: ein zweiter, flacher Namensraum statt einer Umformung der bestehenden Struktur).
let _TEXTSATZ_MODUL_REGELN = Object.create(null);

/* Welche Kennungen dieser Empfänger überhaupt bedienen kann. Aus der eigenen Tabelle
   abgeleitet, nicht danebengepflegt: ein Text, den die Lese-App nicht führt, kann sie auch
   nicht ersetzen — und ein Modul, das ihn mitbringt, bekommt das NAMENTLICH gesagt. */
function _textsatzKennungBekannt(kennung) {
  if (typeof kennung !== 'string') return false;
  if (!kennung.startsWith('strings:') || !kennung.endsWith('.text')) return false;
  const schluessel = kennung.slice('strings:'.length, -'.text'.length);
  return Object.prototype.hasOwnProperty.call(_STRINGS_EINGEBAUT, schluessel);
}

   GEMESSEN gegen den heutigen Kern (nicht nur gegen die Registerzeile übernommen — die
   nannte sechs Regeln, der Kern WENDET nur zwei davon tatsächlich an): `schreibrichtung`
   und `sprachkennung` steuern über `textsatzSchreibrichtungAnwenden`/
   `textsatzSprachkennungAnwenden` `dir`/`lang` am Dokument. `datumsformat`, `dezimaltrenner`,
   `tausendertrenner` und `waehrung` werden im Kern selbst GEPRÜFT UND GESPEICHERT, aber

   zu erfinden, die der Kern selbst nicht hat.

  schreibrichtung: 'ltr',
  datumsformat: 'TT.MM.JJJJ',
  dezimaltrenner: ',',
  tausendertrenner: '.',
  waehrung: 'EUR',
  sprachkennung: 'de-DE',
});
const TEXTSATZ_REGELN_ERLAUBT = Object.freeze({
  schreibrichtung: ['ltr', 'rtl'],
  datumsformat: ['TT.MM.JJJJ', 'JJJJ-MM-TT', 'MM/TT/JJJJ', 'TT/MM/JJJJ'],
  dezimaltrenner: [',', '.'],
  tausendertrenner: ['.', ',', ' ', ''],
  waehrung: null,       // freier ISO-4217-Code, drei Grossbuchstaben

const SEKTOR_BY_ID = Object.freeze(Object.fromEntries(SEKTOREN.map(s => [s.id, s])));
/* Was ein Bereich kann — die Leseregel der Lese-App. Bewusst die knappe Fassung: sie liest,
   sie schreibt nie, und sie braucht darum weder Prüf- noch Verwurfs-Weg (der gehört an die
   Stelle, an der ein Modul HEREINKOMMT, und das ist der Kern). Defensiv, wirft nie. */
function bereichRolle(sektorId, rolle) {
  try {
    const s = SEKTOR_BY_ID[sektorId];
    const r = s && s.rollen;
    return (r && Object.prototype.hasOwnProperty.call(r, rolle)) ? r[rolle] : null;
  } catch (e) { return null; }
}
function bereichFeldHatRolle(sektorId, feldId, rolle) {
  const r = bereichRolle(sektorId, rolle);
  if (r == null) return false;
  return Array.isArray(r) ? r.includes(feldId) : r === feldId;
}

const ANTWORT_FORMAT_ID = 'vivodepot-antwort';
const ANTWORT_FORMAT_VERSION = 1;

const ANTWORT_ECDH_KURVE = 'P-256';
const ANTWORT_HKDF_INFO = 'vivodepot/antwort/v1';
const ANTWORT_PBKDF2_ITERATIONEN = 600000;   // = ANG_PBKDF2_ITERATIONEN im Kern, fest

async function _antwortDeriveKeyPw(passwort, saltBytes) {
  const basis = await crypto.subtle.importKey('raw', new TextEncoder().encode(String(passwort)),
    { name: 'PBKDF2' }, false, ['deriveKey']);

    { name: 'PBKDF2', salt: saltBytes, iterations: ANTWORT_PBKDF2_ITERATIONEN, hash: 'SHA-256' },
    basis, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);

    ANTWORT_FORMAT_ID, String(u.v == null ? '' : u.v), String(u.verfahren || ''),
    String(u.vorgang || ''), String(u.anbieterId || ''),

    { name: 'AES-GCM', iv: base64ToBytes(umschlag.iv), additionalData: _antwortAad(umschlag), tagLength: 128 },
    key, base64ToBytes(umschlag.ct));

}

  if (!umschlag || umschlag.verfahren !== 'einmalpasswort' || typeof umschlag.salt !== 'string') {
    throw new Error('Kein Einmalpasswort-Umschlag.');

async function _antwortEcdhSchluessel(privateKey, publicKey, saltBytes) {
  const roh = await crypto.subtle.deriveBits({ name: 'ECDH', public: publicKey }, privateKey, 256);
  const basis = await crypto.subtle.importKey('raw', roh, { name: 'HKDF' }, false, ['deriveKey']);

    { name: 'HKDF', hash: 'SHA-256', salt: saltBytes, info: new TextEncoder().encode(ANTWORT_HKDF_INFO) },
    basis, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);

async function antwortEntschluesselnSchluessel(umschlag, empfaengerPrivJwk) {
  if (!umschlag || umschlag.verfahren !== 'schluesselpaar' || !umschlag.epk) {
    throw new Error('Kein Schlüsselpaar-Umschlag.');

  const priv = await crypto.subtle.importKey('jwk', empfaengerPrivJwk,
    { name: 'ECDH', namedCurve: ANTWORT_ECDH_KURVE }, false, ['deriveBits']);

    { name: 'ECDH', namedCurve: ANTWORT_ECDH_KURVE }, true, []);

    && ANTWORT_VERFAHREN.indexOf(o.verfahren) >= 0
    && typeof o.iv === 'string' && typeof o.ct === 'string');

/* ══ ZUG 3 — WAS DIE LESE-APP ZEIGT, UND NICHT MEHR ═══════════════════════════════════════
   Entschieden: die Lese-App liest und zeigt an. `antwortAnzeigeModell` ist die EINE Stelle,

  const fehlend = Array.isArray(ds.fehlend) ? ds.fehlend : [];
  const unbekannt = Array.isArray(ds.unbekannt) ? ds.unbekannt : [];

    titel: STRINGS.antwortTitel,
    von: String(a.von || ''),

    vorgang: String(a.vorgang || u.vorgang || ''),

    erstelltAm: String(ds.erstelltAm || u.erstelltAm || ''),
    felder: felder.map((f) => ({
      label: String(f.label || f.kennung || ''),

function erkenneFormat(obj) {

    return 'blackbox';
  }
  /* Verschlüsseltes Vollexport-Depot. ZWEI FORMEN, seit A345 (19.08.2026):
     v3 trägt EIN Chiffrat (`iv`/`ct`), v4 trägt viele Feld-Einheiten und die
     Umschlagstabelle. Der Rumpf ist bei beiden derselbe.

     WARUM DAS HIER STAND UND FEHLTE: die Erkennung fragte nach `iv`/`ct`. Eine
     zerfallene Datei fiel damit auf `unbekannt` — die Lese-App zeigte gar kein
     Passwortfeld, und die Bürgerin bekam „unbekanntes Format" für ihr eigenes,
     völlig intaktes Depot. Gefunden hat es das Konformitäts-Gate über die
     Lese-App (axe-Lauf, 19.08.2026), nicht eine Vermutung.

     keines trägt, ist kaputt, egal was in `kryptoVersion` steht. */

      && typeof obj.depotSalt === 'string') {

    const istV4 = !!obj.einheiten && typeof obj.einheiten === 'object'
      && Array.isArray(obj.umschlagTabelle) && obj.umschlagTabelle.length > 0;
    if (istV3 !== istV4) return 'voll';          // genau eine der beiden Formen
  }
  // Unverschlüsselter Klartext-Export (selten)
  if (obj._typ === 'vivodepot-klartext-export' && obj.depot && typeof obj.depot === 'object') {
    return 'klartext';
  }

  if (typeof obj.schemaVersion === 'number' && obj.sektoren && typeof obj.sektoren === 'object') {
    return 'klartext-roh';

     „unbekannt“ — die Institution bekam für ihre eigene, angeforderte Antwort ein
     Achselzucken. Unterschieden wird an der STRUKTUR (istAntwortUmschlag), nicht an einer
     Versionsnummer allein: eine Datei, die den Rumpf trägt und das Chiffrat nicht, ist
     kaputt, egal was in `v` steht. */
  if (istAntwortUmschlag(obj)) return 'antwort';
  return 'unbekannt';

/* ── Versions-Gate (B3, 21.07.2026) ────────────────────────────────────────
   Bis hierher hatte die Lese-App KEINE explizite Versions-Prüfung: ein Nicht-v3-Umschlag lief
   durch ~600k PBKDF2 und scheiterte erst an der AAD/GCM-Authentifizierung — fail-closed, aber

  if (!umschlag || !KRYPTO_VERSION_ALLOWLIST.includes(umschlag.kryptoVersion)) {
    const e = new Error('Lese-App: kryptoVersion nicht in der Allowlist (' + KRYPTO_VERSION_ALLOWLIST.join('/') + ').');

/* ══ Der Lesepfad der Krypto-Generation 4 — read-only Spiegel von `_zerfallLesen` ══

   die Primitiven des Zerfalls schon (der VdCrypto-Block ist byte-identisch), aber
   KEINEN Lesepfad. Ein v4-Depot kam durch das Versions-Gate (die Allowlist trägt
   [3, 4]) und scheiterte danach an `umschlag.iv`, das es in Generation 4 nicht gibt.
   Der Empfänger hätte jede zerfallene Datei als „beschädigt" gesehen.

   Das ist genau die Bedingung aus A332: die Pseudonymisierung ist eine Eigenschaft
   der DATEI, nicht der Laufzeit — also muss jeder, der die Datei liest, sie auflösen
   können. Der Name reist in der Einheit mit; darum braucht dieser Pfad keinen
   Katalog und kennt auch Adressen, die er nicht erwartet hat.

    if (e.name === 'sektoren') {
      for (const b of (Array.isArray(e.wert) ? e.wert : [])) if (!d.sektoren[b]) d.sektoren[b] = {};

    const i = e.name.indexOf('.');
    if (i > 0) { felder.push({ b: e.name.slice(0, i), f: e.name.slice(i + 1), wert: e.wert }); continue; }

  }
  for (const e of felder) {
    if (!d.sektoren[e.b]) d.sektoren[e.b] = {};

}
async function _zerfallLesenLeseApp(umschlag, ankerKey) {
  const tabelle = Array.isArray(umschlag.umschlagTabelle) ? umschlag.umschlagTabelle : [];
  const anker = tabelle[0];
  if (!anker || !anker.umschlaege || typeof anker.umschlaege !== 'object') {
    throw new Error('Lese-App: die Umschlagstabelle fehlt oder ist leer.');
  }
  const einheiten = (umschlag.einheiten && typeof umschlag.einheiten === 'object') ? umschlag.einheiten : {};

     stand schon da — dass zu jeder EINHEIT ein Umschlag gehört, nicht. Eine Datei, der
     ein Schlüsselumschlag fehlt, wurde damit ANGENOMMEN und die zugehörige Einheit still
     übersprungen: das Feld verschwand aus dem Depot, ohne dass jemand es merkte.
     Gefunden am 19.08.2026 von der neuen Mutation der Kampagnen-Ebene 9b, nicht von einer
     Vermutung. Stiller Verlust an einer fremden Datei ist genau der Fall, gegen den diese
     Ebene steht. */
  const _adrUmschlaege = Object.keys(anker.umschlaege);
  const _adrEinheiten = Object.keys(einheiten);
  if (_adrEinheiten.length !== _adrUmschlaege.length) {
    throw new Error('Lese-App: die Umschlagstabelle passt nicht zu den Einheiten ('
      + _adrUmschlaege.length + ' Umschläge, ' + _adrEinheiten.length + ' Einheiten).');
  }
  for (const a of _adrEinheiten) {
    if (!Object.prototype.hasOwnProperty.call(anker.umschlaege, a)) {
      throw new Error('Lese-App: zu einer Einheit fehlt der Schlüsselumschlag.');
    }
  }
  const gelesen = [];
  for (const adresse of _adrUmschlaege) {
    const zelle = einheiten[adresse];
    if (!zelle) throw new Error('Lese-App: zu einem Umschlag fehlt die Einheit.');
    const aad = VdCrypto.aadEinheit(umschlag.depotUUID, adresse);
    const inhaltKey = await VdCrypto.schluesselEntwickeln(anker.umschlaege[adresse], ankerKey, aad);
    gelesen.push(await VdCrypto.decryptDepot(zelle, inhaltKey, aad));
  }
  return _zerfallZusammensetzenLesen(gelesen);
}

/* ── Entschlüsselung Vollexport-Depot (read-only Spiegel von depotLaden) ───── */
async function leseDepotUmschlag(umschlag, password) {
  _versionsGate(umschlag);                                  // VOR jeder Ableitung (B3)
  const pbkdf2Salt = base64ToBytes(umschlag.pbkdf2.salt);
  const depotSalt  = base64ToBytes(umschlag.depotSalt);
  const depotUUID  = umschlag.depotUUID;
  await VdCrypto.setupSession(password, pbkdf2Salt);        // falsches Passwort → GCM-Fehler beim Entschlüsseln
  const subKey = await deriveDepotKeyV2(sessionHkdfKey, depotSalt, depotUUID);
  if (umschlag.kryptoVersion === 4) return _zerfallLesenLeseApp(umschlag, subKey);
  const obj = await VdCrypto.decryptDepot({ iv: umschlag.iv, ct: umschlag.ct }, subKey, _AAD_DEPOT_V2);
  return obj;
}

/* ── Entschlüsselung Sub-Depot-Blackbox (read-only Spiegel von subDepotEntsiegeln) ── */
async function depotMasterHkdfKey(passwort, pbkdf2Salt) {
  const bits = await deriveMasterBits(passwort, pbkdf2Salt);
  const key = await importMasterHkdfKey(bits);
  new Uint8Array(bits).fill(0);
  return key;
}
async function leseSubUmschlag(umschlag, subPasswort) {
  _versionsGate(umschlag);                                  // VOR jeder Ableitung (B3)
  const pbkdf2Salt = base64ToBytes(umschlag.pbkdf2.salt);
  const depotSalt  = base64ToBytes(umschlag.depotSalt);
  const masterKey  = await depotMasterHkdfKey(subPasswort, pbkdf2Salt);
  const subKey     = await deriveDepotKeyV2(masterKey, depotSalt, umschlag.depotUUID);
  const inhalt     = await VdCrypto.decryptDepot({ iv: umschlag.iv, ct: umschlag.ct }, subKey, _AAD_DEPOT_V2);
  return inhalt;
}

/* ── Datei-Magic-Bytes (U2-ADR-043) — Lese-Seite ────────────────────────────
   Erkennung + Stripping der Format-Kennung am Datei-Anfang. Read-only (die Lese-App schreibt nie).
   TOLERANT: fehlt die Kennung, ist es eine Alt-Datei (bare JSON) und lädt verlustfrei. Identische
   Strip-Semantik wie in der Bürger-App. Außerhalb des VdCrypto-Blocks (2. Script-Block). */
const DATEI_MAGIC = 'VIVODEPOT';
function magicStrippen(text) {
  const s = String(text == null ? '' : text);
  if (!s.startsWith(DATEI_MAGIC)) return { json: s, magic: false, version: 0 };   // Alt-Datei: bare JSON, verlustfrei
  return { json: s.slice(DATEI_MAGIC.length + 1), magic: true, version: s.charCodeAt(DATEI_MAGIC.length) };
}

/* ── U2-ADR-078: notfallCacheAusUmschlag ENTFERNT ─────────────────────────────
   Der passwortlose Stufe-1-Cache entfällt ersatzlos; ein Umschlag trägt kein
   `notfallCache`-Klartext-Geschwister mehr, und ein alter, der es noch trägt, wird

/* ════════════════════════════════════════════════════════════════════════
   QR-EMPFANG (F-3) — Klartext-Notfall + Mehr-Teile-Sammlung
   ──────────────────────────────────────────────────────────────────────── */
// Notfall-QR-Klartext (Bürger-App notfallKernText): „VIVODEPOT NOTFALL\nlabel: wert…"
function parseNotfallQrText(text) {
  if (typeof text !== 'string') return null;
  const zeilen = text.split(/\r?\n/);
  if (!zeilen.length) return null;
  if (zeilen[0].trim() !== STRINGS.notfallQrKopf) return null;
  const out = [];
  for (let i = 1; i < zeilen.length; i++) {
    const z = zeilen[i];
    const idx = z.indexOf(':');
    if (idx < 0) continue;
    const label = z.slice(0, idx).trim();
    const wert = z.slice(idx + 1).trim();
    if (label) out.push({ label, wert });
  }
  return { stand: null, zeilen: out };
}
// Rahmen „VDQR|gid|i/n|nutzlast" (Pipe-Trenner, U2-ADR-082: bewusst proprietär, identisch zur
// Schreib-Seite in vivodepot.html — qrTeilePacken/_qrRahmenParsen). null bei jedem Text, der
// nicht mit „VDQR|" beginnt (z. B. Legacy-Notfall-Klartext, eine vCard, rohes Depot-JSON) —
// der bewährte Passthrough an parseNotfallQrText/JSON.parse in verarbeiteQrText bleibt intakt.
function _qrRahmenParsen(rahmen) {
  const s = String(rahmen == null ? '' : rahmen);
  if (!s.startsWith('VDQR|')) return null;
  const p1 = s.indexOf('|');
  const p2 = s.indexOf('|', p1 + 1);
  const p3 = s.indexOf('|', p2 + 1);
  if (p1 < 0 || p2 < 0 || p3 < 0) return null;
  const gid = s.slice(p1 + 1, p2);
  const mm = s.slice(p2 + 1, p3).match(/^(\d+)\/(\d+)$/);
  if (!mm) return null;
  return { gruppe: gid, index: +mm[1], gesamt: +mm[2], nutzlast: s.slice(p3 + 1) };
}
/* ══ DER QR-ZUSAMMENSETZER, WIEDERAUFGENOMMEN (Kette, Auftrag 8) ═══════════════════════════
   U2-ADR-085 §4 Punkt 3 hat ihn nicht fachlich gestrichen, sondern als TOTEN CODE: „null
   Aufrufer im Produktivcode … streichen ODER BEGRÜNDEN". Die Bedingung ist entfallen — Zug 2
   dieses Auftrags IST der Aufrufer, und die mehrteilige Ausgabe „Teil i von n" ist seit dem
   Produktkonzept vom 19./20.08. Regelfall statt Notlösung. Freigabe: Entscheidung der
   Gründerin vom 20.08.2026. U2-ADR-085 bleibt im Übrigen in Kraft.

   REIN UND ZUSTANDSLOS. Der zustandsbehaftete Sammler `qrTeilAufnehmen` darunter baut darauf
   auf — EIN Mechanismus, nicht zwei nebeneinander. Ein FEHLENDER Teil wird BENANNT statt als
   Teilergebnis ausgegeben; eine stumme Teilausgabe sieht aus wie ein Ergebnis, und genau das
   ist der Fehlschlag, den dieser Zug fangen muss. */
function qrTeileZusammensetzen(rahmenListe) {
  const liste = Array.isArray(rahmenListe) ? rahmenListe : [];
  if (!liste.length) return { fertig: false, grund: 'leer', fehlend: [] };
  let gruppe = null, gesamt = 0;
  const stuecke = new Map();
  for (const r of liste) {
    const p = _qrRahmenParsen(typeof r === 'string' ? r : (r && r.rahmen));
    if (!p) return { fertig: false, grund: 'kein-rahmen', fehlend: [] };
    if (gruppe === null) { gruppe = p.gruppe; gesamt = p.gesamt; }
    else if (p.gruppe !== gruppe || p.gesamt !== gesamt) return { fertig: false, grund: 'fremde-gruppe', fehlend: [] };
    if (p.index < 1 || p.index > gesamt) return { fertig: false, grund: 'index', fehlend: [] };
    stuecke.set(p.index, p.nutzlast);
  }
  const fehlend = [];
  for (let k = 1; k <= gesamt; k++) if (!stuecke.has(k)) fehlend.push(k);
  if (fehlend.length) return { fertig: false, grund: 'unvollstaendig', gruppe, gesamt, empfangen: stuecke.size, fehlend };
  let text = '';
  for (let k = 1; k <= gesamt; k++) text += stuecke.get(k);
  return { fertig: true, grund: null, gruppe, gesamt, empfangen: gesamt, fehlend: [], text };
}
// Sammelt Teile index-verschlüsselt (Map<index,Rahmen>) — beliebige Scan-Reihenfolge.
// Rückgabe: { fertig:true, text } | { fertig:false, i, n, empfangen, fehlend:[…fehlende Indizes] }
// | null (kein VDQR-Rahmen). Setzt über qrTeileZusammensetzen zusammen — EIN Mechanismus.
function qrTeilAufnehmen(text) {
  const p = _qrRahmenParsen(text);
  if (!p) return null;
  if (!qrTeile.has(p.gruppe)) qrTeile.set(p.gruppe, { n: p.gesamt, rahmen: new Map() });
  const slot = qrTeile.get(p.gruppe);
  if (slot.n !== p.gesamt) return null;   // inkonsistente Gruppen-/Gesamtzahl-Angabe
  slot.rahmen.set(p.index, String(text));
  const z = qrTeileZusammensetzen(Array.from(slot.rahmen.values()));
  if (z.fertig) { qrTeile.delete(p.gruppe); return { fertig: true, text: z.text }; }
  return { fertig: false, i: p.index, n: slot.n, empfangen: slot.rahmen.size, fehlend: z.fehlend };
}

  const farbe = MODUS_FARBE[modus] || MODUS_FARBE.anker;
  document.documentElement.style.setProperty('--akzent', farbe);
  const app = el('app');
  if (app) {
    app.classList.remove('modus-sub', 'modus-notfall');
    if (modus === 'sub') app.classList.add('modus-sub');
    if (modus === 'notfall') app.classList.add('modus-notfall');
  }
}

// Befund 1 (CC-Auftrag „Die Lese-App wird nirgends mitgemessen", 12./13.08.2026): `<header>`
// statt `<div>` — wortgleicher Spiegel des Kerns (vivodepot.html: `<header class="topbar">`).
// Ohne Landmark lag die Topbar auf JEDER Sicht außerhalb von main/nav (axe `region`, 51 Knoten
// über alle 24 gemessenen Sichten). Rein semantisch — `.topbar` bleibt klassenbasiert selektiert,
// kein CSS-Bruch.
function topbarHTML(titel, mitSchliessen) {
  return '<header class="topbar">' +
    '<div class="tb-titel">' + escapeHTML(STRINGS.appName) + '</div>' +
    '<div class="tb-mitte">' + escapeHTML(titel || '') + '</div>' +
    '<div class="tb-aktionen">' +
      (mitSchliessen ? '<button class="btn btn-sek" id="btn-schliessen">' + escapeHTML(STRINGS.schliessen) + '</button>' : '') +
    '</div></header>';
}

function subBannerHTML() {
  /* Ein EMPFÄNGER-AUSSCHNITT sagt zuerst, dass er einer ist (U2-ADR-156, 21.08.2026). Ohne
     diesen Satz sähe die Datei aus wie ein sehr leeres Depot, und der Empfänger hielte für
     „alles, was sie hat", was in Wahrheit sein Ausschnitt ist. Die Marke steht IM
     verschlüsselten Teil — ohne Passwort ist sie nicht zu sehen, und das ist richtig so. */
  const marke = data && data.empfaengerAusschnitt;
  if (marke && typeof marke === 'object') {
    const von = [((data.sektoren || {}).identitaet || {}).vorname, ((data.sektoren || {}).identitaet || {}).nachname, ((data.sektoren || {}).identitaet || {}).nachname2]
      .filter(x => typeof x === 'string' && x).join(' ');
    const txt = von ? STRINGS.ausschnittBannerVon.replace('{name}', von) : STRINGS.ausschnittBannerOhneName;
    return '<div class="sub-banner">' + escapeHTML(txt) + '</div>';
  }
  if (leseModus !== 'sub' || !subInfo) return '';
  const inhaber = subInfo.inhaberin || subInfo.bezeichnung || '';
  let txt = STRINGS.subBannerVor + inhaber;
  if (subInfo.verwaltetVon) txt += STRINGS.subBannerVerwaltet + subInfo.verwaltetVon;
  return '<div class="sub-banner">' + escapeHTML(txt) + '</div>';
}

/* ── F-1 Begrüßung + zwei Eingangswege (U2-ADR-085 §5: Kamera-Tür entfernt) ─── */
// Weg 1 (CC-Auftrag Eingangsschirm, 20.07.2026 — Grundsatz „Wer den Eingangsschirm zeigt,
// räumt vorher auf", analog zur Bürger-App): zentral hier statt bei den Aufrufern — der
// QR-Zurück-Knopf und der generische Hinweis-Helfer (renderHinweisMitZurueck) taten das
// bislang NICHT. Die Lese-App hat kein Vorschau-Konzept zu schützen (anders als die
// Bürger-App): jede vorhandene `data` ist ein bereits entschlüsselter, echter Depot-Auszug,
// daher genügt eine einfache Prüfung ohne Ausnahme.
function renderWelcome() {
  if (data) entladen();
  try { kameraStoppen(); } catch (e) { /* vor der Definition beim ersten Aufruf */ }
  const wrap = el('app');
  setModusFarbe('anker');
  const absaetze = STRINGS.welcomeEinfuehrung.map(p => '<p>' + escapeHTML(p) + '</p>').join('');
  wrap.className = 'welcome-screen';
  wrap.innerHTML =
    // Befund 1: role="main" statt eines echten <main>-Tags — geringster Eingriff, dieselbe
    // Lösung wie an Vorlage-Stellen im Kern (ARIA-Rolle statt Struktur-Umbau). Ohne sie fehlte
    // JEDE Landmark auf dem Eingangsschirm (axe landmark-one-main + region).
    '<div class="welcome" role="main">' +
      '<h1>' + escapeHTML(STRINGS.welcomeTitel) + '</h1>' +
      '<div class="welcome-text">' + absaetze + '</div>' +
      '<div class="wege">' +
        wegKarteHTML('weg-datei', STRINGS.wegDatei, STRINGS.wegDateiHint) +
        wegKarteHTML('weg-einfuegen', STRINGS.wegEinfuegen, STRINGS.wegEinfuegenHint) +
        wegKarteHTML('weg-kamera', STRINGS.wegKamera, STRINGS.wegKameraHint) +
      '</div>' +
      '<input type="file" id="datei-input" accept=".vivodepot,.json,application/json" hidden>' +
    '</div>';
  el('weg-datei').addEventListener('click', () => el('datei-input').click());
  el('datei-input').addEventListener('change', onDateiGewaehlt);
  el('weg-einfuegen').addEventListener('click', renderEinfuegen);
  el('weg-kamera').addEventListener('click', renderKamera);
}
function wegKarteHTML(id, titel, hint) {
  return '<button class="weg-karte" id="' + id + '">' +
    '<span class="weg-titel">' + escapeHTML(titel) + '</span>' +
    '<span class="weg-hint">' + escapeHTML(hint) + '</span>' +
  '</button>';
}

/* ── F-2 Datei öffnen ─────────────────────────────────────────────────────── */
function onDateiGewaehlt(ev) {
  const datei = ev && ev.target && ev.target.files && ev.target.files[0];
  if (!datei) return;
  const reader = new FileReader();
  reader.onload = () => {
    let obj;
    try { obj = JSON.parse(magicStrippen(reader.result).json); }
    catch (e) { renderFehler(STRINGS.dateiUnlesbar); return; }
    verarbeiteDatei(obj);
  };
  reader.onerror = () => renderFehler(STRINGS.dateiUnlesbar);
  reader.readAsText(datei);
}

function verarbeiteDatei(obj) {
  const format = erkenneFormat(obj);
  if (format === 'voll') {
    // U2-ADR-078: kein passwortloser Notfall-Cache mehr — ein Voll-Depot wird nur mit dem
    // Übergabe-Passwort geöffnet.
    renderPasswort('voll', obj);
  } else if (format === 'blackbox') {
    renderPasswort('sub', obj.umschlag, obj);
  } else if (format === 'klartext') {
    klartextWarnung = true;
    leseModus = 'anker'; subInfo = null;
    data = _foldVollmachtenLesen(obj.depot);
    renderVollExport();
  } else if (format === 'klartext-roh') {
    klartextWarnung = true;
    leseModus = 'anker'; subInfo = null;
    data = _foldVollmachtenLesen(obj);
    renderVollExport();
  } else if (format === 'qr-pdf') {
    renderQrPdf(obj);
  } else if (format === 'qr-bereich') {
    renderQrBereich(obj);
  } else if (format === 'antwort') {
    renderAntwortOeffnen(obj);
  } else {
    renderFehler(STRINGS.formatUnbekannt);
  }
}

// U2-ADR-082: QR-Selbstauskunft-Sichten — kein Depot-Umschlag, kein Passwort-Gate. Beide
// Nutzlasten sind unverschlüsselte, von der Bürgerin bewusst als QR freigegebene Selbstauskunft
// (PDF-Selbstverifikation bzw. Bereich-Export), im Stil der Notfall-Sicht dargestellt.
function renderQrPdf(obj) {
  const wrap = el('app');
  setModusFarbe('anker');
  wrap.className = 'app-shell modus-notfall';
  const titel = obj.titel || STRINGS.qrPdfTitel;
  let html = topbarHTML(titel, true) +
    '<div class="shell-body shell-einzel"><main class="content"><div class="bereich notfall-rahmen">' +
    '<div class="bereich-kopf"><h1>' + escapeHTML(titel) + '</h1></div>' +
    '<p class="gesperrt">' + escapeHTML(STRINGS.qrSelbstauskunftHinweis) + '</p>';
  // meta.datum (Schreibseite) ist bereits TT.MM.JJJJ formatiert, kein ISO — direkt anzeigen.
  if (obj.stand) html += '<p class="notfall-stand">' + escapeHTML(STRINGS.notfallStand) + ': ' + escapeHTML(String(obj.stand)) + '</p>';
  const bereiche = (Array.isArray(obj.bereiche) ? obj.bereiche : []).filter((b) => b && !b.leer);
  if (!bereiche.length) {
    html += '<div class="hinweis-box">' + escapeHTML(STRINGS.notfallLeer) + '</div>';
  } else {
    for (const b of bereiche) {
      for (const sek of (b.sektionen || [])) {
        // Befund 1: <h2> statt <h3> — nach der h1-Promotion des bereich-kopf (oben) wäre <h3>
        // ein übersprungenes Niveau (axe heading-order).
        html += '<div class="sektion"><h2>' + escapeHTML(sek.titel || '') + '</h2>';
        for (const z of (sek.zeilen || [])) {
          html += '<div class="feld-zeile"><div class="feld-label">' + escapeHTML(String(z.label || '')) + '</div>' +
            '<div class="feld-wert">' + escapeHTML(String(z.wert == null ? '' : z.wert)) + '</div></div>';
        }
        html += '</div>';
      }
    }
  }
  html += '</div></main></div>';
  wrap.innerHTML = html;
  wireTopbar();
}
function renderQrBereich(obj) {
  const wrap = el('app');
  setModusFarbe('anker');
  wrap.className = 'app-shell modus-notfall';
  const titel = obj.bereichLabel || STRINGS.qrBereichTitel;
  let html = topbarHTML(titel, true) +
    '<div class="shell-body shell-einzel"><main class="content"><div class="bereich notfall-rahmen">' +
    '<div class="bereich-kopf"><h1>' + escapeHTML(titel) + '</h1></div>' +
    '<p class="gesperrt">' + escapeHTML(STRINGS.qrSelbstauskunftHinweis) + '</p>';
  // obj.stand traegt einen VOLLEN ISO-Zeitstempel (Schreibseite vivodepot.html: `new Date().toISOString()`,
  // NICHT geschnitten — der frueher hier behauptete `.slice(0,10)` stand dort nie). standKurz liest ihn
  // lokal und zeigt Datum UND Uhrzeit; geschnitten waere er nachts 0–2 Uhr einen Tag alt.
  if (obj.stand) html += '<p class="notfall-stand">' + escapeHTML(STRINGS.notfallStand) + ': ' + escapeHTML(standKurz(obj.stand)) + '</p>';
  const felder = Array.isArray(obj.felder) ? obj.felder : [];
  if (!felder.length) {
    html += '<div class="hinweis-box">' + escapeHTML(STRINGS.notfallLeer) + '</div>';
  } else {
    html += '<div class="sektion">';
    for (const f of felder) {
      html += '<div class="feld-zeile"><div class="feld-label">' + escapeHTML(String(f.label || '')) + '</div>' +
        '<div class="feld-wert">' + escapeHTML(String(f.wert == null ? '' : f.wert)) + '</div></div>';
    }
    html += '</div>';
  }
  html += '</div></main></div>';
  wrap.innerHTML = html;
  wireTopbar();
}

// U2-ADR-078: der passwortlose Notfall-Cache-Knopf ist entfernt — ein zugesandtes Depot wird
// NUR mit dem Übergabe-Passwort geöffnet. Ein alter Umschlag mit `notfallCache`-Klartext-Geschwister
// wird hier NICHT mehr passwortlos angezeigt (das war das Art-9-Leck aus ADR-099/109).
function renderPasswort(art, umschlag, blackboxDatei) {
  const wrap = el('app');
  setModusFarbe(art === 'sub' ? 'sub' : 'anker');
  wrap.className = 'sheet-screen';
  const hint = art === 'sub' ? STRINGS.pwHintSub : STRINGS.pwHintVoll;
  wrap.innerHTML =
    // Befund 1: role="main" + <h1> — eigenständiger Vollbild-Schirm, kein anderer h1 auf dieser
    // Sicht (dieselbe „ein h1 je Sicht"-Regel wie im Kern, vivodepot.html:27382).
    '<div class="sheet" role="main">' +
      '<h1>' + escapeHTML(STRINGS.pwTitel) + '</h1>' +
      '<p class="hint">' + escapeHTML(hint) + '</p>' +
      '<form id="pw-form" autocomplete="off">' +
        '<input type="password" id="pw-feld" class="pw-feld" placeholder="' + escapeHTML(STRINGS.pwPlaceholder) + '" autocomplete="off">' +
        '<div class="pw-fehler" id="pw-fehler" hidden></div>' +
        '<div class="sheet-aktionen">' +
          '<button type="button" class="btn btn-sek" id="btn-zurueck">' + escapeHTML(STRINGS.zurueck) + '</button>' +
          '<button type="submit" class="btn">' + escapeHTML(STRINGS.pwOeffnen) + '</button>' +
        '</div>' +
      '</form>' +
    '</div>';
  el('btn-zurueck').addEventListener('click', renderWelcome);   // Aufräumung sitzt jetzt zentral in renderWelcome()
  const form = el('pw-form');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = el('pw-feld').value;       // nie loggen, nie in URL
    try {
      let obj;
      if (art === 'sub') obj = await leseSubUmschlag(umschlag, pw);
      else obj = await leseDepotUmschlag(umschlag, pw);
      el('pw-feld').value = '';            // Klartext-Passwort sofort aus dem Feld räumen
      data = _foldVollmachtenLesen(obj);
      if (art === 'sub') {
        leseModus = 'sub';
        subInfo = { inhaberin: (blackboxDatei && blackboxDatei.inhaberin) || '', bezeichnung: (blackboxDatei && blackboxDatei.bezeichnung) || '' };
      } else { leseModus = 'anker'; subInfo = null; }
      renderVollExport();
    } catch (err) {
      // B3: Versions-Ablehnung ist KEIN Passwort-Fehler — sonst versucht die Nutzerin ein
      // korrektes Passwort endlos erneut. Unterscheidung über den Marker, nicht über Fehlertexte.
      const istVersion = !!(err && err.vivodepotGrund === 'version');
      const f = el('pw-fehler');
      f.textContent = istVersion ? STRINGS.versionNichtLesbar : STRINGS.pwFalsch;
      f.hidden = false;
      el('pw-feld').value = '';
      if (!istVersion) el('pw-feld').focus();   // bei Versions-Ablehnung hilft kein zweiter Versuch
    }
  });
  const pf = el('pw-feld'); if (pf && pf.focus) pf.focus();
}

/* ── F-4 Vollexport-Lese-Sicht (alle zwölf Bereiche, read-only) ──────────── */
let aktiverSektorId = null;
function renderVollExport() {
  const wrap = el('app');
  setModusFarbe(leseModus === 'sub' ? 'sub' : 'anker');
  wrap.className = 'app-shell';
  if (!aktiverSektorId) aktiverSektorId = SEKTOREN[0].id;
  wrap.innerHTML =
    topbarHTML(STRINGS.sichtVoll, true) +
    subBannerHTML() +
    (klartextWarnung ? '<div class="klartext-warn">' + escapeHTML(STRINGS.klartextHinweis) + '</div>' : '') +
    '<div class="shell-body">' +
      '<nav class="sidebar" id="sidebar">' + sidebarHTML() + '</nav>' +
      '<main class="content" id="content">' + sektorHTML(aktiverSektorId) + '</main>' +
    '</div>';
  wireTopbar();
  wireSidebar();
  /* A318 Zug 2b: die Prüfung läuft NACH dem ersten Zeichnen und zeichnet dann neu.
     Sie ist asynchron (WebCrypto), das Zeichnen ist es nicht — und ein Empfänger soll
     sein Depot sofort sehen, nicht erst nach der Krypto. Beim zweiten Aufruf ist der
     Stand da und die Bedingung greift nicht mehr. */
  if (!_vorlagenStand || _vorlagenStandFuer !== data) vorlagenStandRechnen(renderVollExport);
}
function sidebarHTML() {
  return SEKTOREN.map(s =>
    '<button class="nav-item' + (s.id === aktiverSektorId ? ' aktiv' : '') + '" data-sektor="' + escapeHTML(s.id) + '">' +
      escapeHTML(s.label) +
    '</button>'
  ).join('') +
  // Situationsblätter als zusätzliche Navigation
  '<div class="nav-trenner">' + escapeHTML(STRINGS.sichtSituation) + '</div>' +
  SITUATIONEN.map(si =>
    '<button class="nav-item nav-sit" data-situation="' + escapeHTML(si.id) + '">' + escapeHTML(si.titel) + '</button>'
  ).join('');
}
function wireSidebar() {
  const sb = el('sidebar');
  sb.querySelectorAll('[data-sektor]').forEach(btn => btn.addEventListener('click', () => {
    aktiverSektorId = btn.getAttribute('data-sektor');
    el('content').innerHTML = sektorHTML(aktiverSektorId);
    sb.querySelectorAll('.nav-item').forEach(b => b.classList.remove('aktiv'));
    btn.classList.add('aktiv');
  }));
  sb.querySelectorAll('[data-situation]').forEach(btn => btn.addEventListener('click', () => {
    el('content').innerHTML = situationContentHTML(btn.getAttribute('data-situation'));
    sb.querySelectorAll('.nav-item').forEach(b => b.classList.remove('aktiv'));
    btn.classList.add('aktiv');
  }));
}
function wireTopbar() {
  const b = el('btn-schliessen');
  if (b) b.addEventListener('click', onSchliessen);
}

/* ── U2-ADR-037: read-only Spiegelung der eingewanderten Template-Felder ─────
   data.feldDefinitionen[] liegt bereits im entschlüsselten Depot — die Lese-App
   rendert es nur (KEINE Prüfung, KEINE Krypto, schlafende VC-Kopie bleibt schlafend).
   Adapter auf die Lese-feldZeileHTML; nur renderbare flache Typen. Defensiv (|| []),
   kein Verlass auf Init.
   NACHTRAG 17.08.2026: hier stand „codierte Felder als Rohwert (keine Code-Aufloesung)".
   Das war kein Entwurf, sondern eine Luecke — s. `_tplDefAlsFeld` unten. */
/* ══ FÜNF TYPEN FEHLTEN (A359, Bauweg 3 — 20.08.2026) ══════════════════════════════════
   Gemessen: der Kern rendert neun angedockte Feldarten, die Lese-App kannte vier. Ein
   angedocktes `textarea`-, `mehrfachauswahl`-, `liste`-, `ref`- oder `refMehrfach`-Feld war
   beim Empfänger unsichtbar — es stand im Depot, es stand auf dem Blatt aus A389, und die
   zweite Säule zeigte es nicht.

   DER BEFUND AUS A350 LAUTETE ANDERS, und die Korrektur gehört hierher: dort stand, die
   Lese-App „kenne `feldDefinitionen` nicht". Sie kennt sie seit A276/A277 (`_tplAbschnitte`
   direkt darunter). Gemessen wurde damals ein Depot OHNE Definitionen — eine leere Messung,
   keine negative. Der wirkliche Befund ist dieser hier, und er ist kleiner.

   DER RENDERER KONNTE ES SCHON: `feldZeileHTML` behandelt Listen mit Unterfeldern und
   `ref:mappe` seit jeher — es fehlte allein die Erlaubnis in dieser Menge und die zwei
   Angaben, die der Adapter darunter fallen liess. */
const _TPL_RENDER_TYPEN = new Set(['text', 'textarea', 'zahl', 'datum', 'auswahl',
  'mehrfachauswahl', 'liste', 'ref', 'refMehrfach']);
/* SPIEGEL VON `_templateDefAlsFeld` IM KERN — und bis 17.08.2026 ein unvollstaendiger.
   Der Adapter liess zwei Angaben fallen, die der Kern uebernimmt, und beide entscheiden,
   WAS DER EMPFAENGER LIEST:

     `codeSystemId` -> `codeListe`. Ein Code-Slot-Feld traegt seit E1 Option C einen
       Chip-Array `[{text, code}, …]`. Ohne den Marker faellt der Wert nicht in den
       Chip-Zweig von `feldWertText`, sondern in den String-Zweig — genau der Fund
       T-CROSS-01 vom 15.07.2026, nur eine Ebene tiefer: dort traf es die eingebauten
       Code-Felder, hier die angedockten aus einem signierten Anbieter-Template.
     `optionen` -> ein `auswahl`-Feld ohne Optionsliste zeigt den ROHEN SCHLUESSEL
       statt des Labels. Dieselbe Klasse wie der Paritaets-Nachtrag vom 23.07. bei
       `mehrfachauswahl` („trauer" statt „Trauerfall").

   Die Buergerin sah die Bezeichnung, der Empfaenger eine Kennung — zwei Ansichten
   desselben Feldes, die verschieden aussagen. Dieselbe Klasse, die A273 fuer die
   Beschriftungen geschlossen hat.

   NUR DAS, WAS DER KERN AUCH UEBERNIMMT: `pflicht` bleibt draussen (die Lese-App
   bearbeitet nicht), `hint` ebenso (sie rendert keinen). Kein neuer Mechanismus —
   die Aufloesung selbst leistet `feldWertText` seit jeher, ihr fehlte nur der Marker. */
function _tplDefAlsFeld(def) {
  const typ = (def.mehrzeilig && def.typ === 'text') ? 'textarea' : def.typ;
  const f = { id: def.feldId, typ: typ, label: def.label || def.feldId };
  if (def.codeSystemId) f.codeListe = def.codeSystemId;
  if (Array.isArray(def.optionen)) f.optionen = def.optionen;
  /* A359 Bauweg 3: die zwei Angaben, ohne die drei der fünf neuen Typen nichts anzeigen —
     eine Liste ohne Unterfelder rendert keine Zeile, ein `ref` ohne Entität findet seine
     Mappe nicht. Wörtlich dieselbe Auswahl wie im Kern (`_templateDefAlsFeld`); `pflicht`
     und `hint` bleiben weiterhin draussen, weil die Lese-App nicht bearbeitet. */
  if (Array.isArray(def.unterFelder) && def.unterFelder.length) f.unterFelder = def.unterFelder;
  if (def.entitaet) f.entitaet = def.entitaet;
  /* UND DAS SENSIBEL-FLAG, und es ist der zweite Fund dieses Bauwegs: die Lese-App hielt ein
     sensibles KERN-Feld unbedingt zurück (Befund 2 vom 12./13.08.) und zeigte das angedockte
     daneben an. Dieselbe Klasse wie die Offenlegung im Vollexport (A350 Fund 1), eine
     Anwendung weiter. Das Flag reist mit; geprüft wird es unten in `sektorHTML`, an derselben
     Stelle wie für Kern-Felder. */
  if (def.sensibel === true) f.sensibel = true;
  return f;
}
function _tplAbschnitte(sektorId) {
  const defs = (data && Array.isArray(data.feldDefinitionen))
    ? data.feldDefinitionen.filter(d => d && d.sektorId === sektorId && _TPL_RENDER_TYPEN.has(d.typ)) : [];
  const gruppen = [], byLabel = Object.create(null);
  for (const d of defs) {
    const label = (d.abschnitt != null && d.abschnitt !== '') ? String(d.abschnitt) : 'Weitere Felder';
    if (!byLabel[label]) { byLabel[label] = { label: label, felder: [] }; gruppen.push(byLabel[label]); }
    byLabel[label].felder.push(d);
  }
  return gruppen;
}
/* ── Der Prüfstand am Bildschirm (A318 Zug 2c) ────────────────────────────────────
   Der Stand wird EINMAL je geöffnetem Depot gerechnet (Krypto ist asynchron, das
   Zeichnen ist es nicht) und liegt hier, bis ein anderes Depot geöffnet wird. Erst
   nach dem Rechnen wird neu gezeichnet — vorher steht keine Marke da, nicht eine
   falsche. Eine Marke „wird geprüft …", die stehen bleibt, wenn die Prüfung
   fehlschlägt, wäre schlimmer als keine. */
let _vorlagenStand = null;         // feldId -> { zustand, anbieter, … } | null = noch nicht gerechnet
let _vorlagenStandFuer = null;     // das Depot-Objekt, zu dem der Stand gehört

function vorlagenStandZuruecksetzen() { _vorlagenStand = null; _vorlagenStandFuer = null; }

/* Rechnet den Stand für das gerade geöffnete Depot und zeichnet danach neu.
   Wirft nie: eine Anzeige, die beim Prüfen abstürzt, nähme dem Empfänger das ganze
   Depot statt nur die Marke. */
async function vorlagenStandRechnen(neuZeichnen) {
  const d = data;
  if (!d || _vorlagenStandFuer === d) return _vorlagenStand;
  try {
    const karte = await vorlagenPruefstandBerechnen(d, {});
    if (data !== d) return _vorlagenStand;            // inzwischen anderes Depot offen
    _vorlagenStand = karte;
    _vorlagenStandFuer = d;
  } catch (e) {
    if (data === d) { _vorlagenStand = Object.create(null); _vorlagenStandFuer = d; }
  }
  if (typeof neuZeichnen === 'function') { try { neuZeichnen(); } catch (e) { /* Anzeige ist Komfort */ } }
  return _vorlagenStand;
}

/* Die Marke zu einer Feldgruppe. Alle Felder eines Abschnitts stammen aus derselben
   Vorlage — geprüft wird darum am ersten, der überhaupt einen Stand hat. Findet sich
   keiner, steht dort NICHTS: ein Feld ohne jeden Vorlagen-Bezug ist keine unbelegte
   Vorlage, sondern gar keine. */
function vorlagenMarkeHTML(felder) {
  if (!_vorlagenStand) return '';                     // noch nicht gerechnet → keine Marke
  let stand = null;
  for (const d of felder) {
    const s = _vorlagenStand[d.feldId];
    if (s) { stand = s; break; }
  }
  if (!stand) return '';
  const name = stand.anbieter ? String(stand.anbieter) : '';
  let text, klasse;
  if (stand.zustand === 'gueltig') {
    klasse = 'gueltig';
    text = name ? STRINGS.vorlageGeprueft.replace('{anbieter}', name) : STRINGS.vorlageGeprueftOhneNamen;
  } else if (stand.zustand === 'abgelaufen') {
    klasse = 'abgelaufen';
    text = name ? STRINGS.vorlageAbgelaufen.replace('{anbieter}', name) : STRINGS.vorlageAbgelaufenOhneNamen;
  } else if (stand.zustand === 'ungueltig') {
    klasse = 'ungueltig';
    text = STRINGS.vorlageUngueltig;
  } else {
    klasse = 'nicht-pruefbar';
    text = STRINGS.vorlageNichtPruefbar;
  }
  return '<p class="vorlage-marke vorlage-marke--' + klasse + '">' + escapeHTML(text) + '</p>';
}

// Ein Bereich, alle Sektionen/Felder read-only.
function sektorHTML(sektorId) {
  const sek = SEKTOR_BY_ID[sektorId];
  if (!sek) return '';
  let html = '<div class="bereich">' +
    // Befund 1: <h1> statt <h2> — wortgleicher Spiegel des Kerns (vivodepot.html:27388, axe
    // page-has-heading-one). Genau eine Bereich-Sicht ersetzt je Render #app vollständig, nie
    // zwei bereich-kopf gleichzeitig — sicher als einziges h1 der Sicht.
    '<div class="bereich-kopf"><h1>' + escapeHTML(sek.label) + '</h1></div>';
  if (sek.einfuehrungstext) html += '<p class="bereich-intro">' + escapeHTML(sek.einfuehrungstext) + '</p>';
  const daten = (data && data.sektoren && data.sektoren[sektorId]) || {};
  for (const sektion of (sek.sektionen || [])) {
    const felder = sektion.felder || [];
    // Sektion auslassen, wenn kein Feld eingetragen ist (kompakte Lese-Sicht).
    // Sensibel-Zurückhaltung (Befund 2, 12./13.08.2026): schema- ODER nutzer-sensible
    // Felder erscheinen in der Lese-App nie, unbedingt (kein inklSensibel-Gegenstück).
    // M1 Zug 5/Zug 5: über die Auflösung — nach dem Umzug hat der Bereich den Schlüssel nicht mehr.
    const sichtbar = felder.filter(f => feldEingetragen(f, feldRohwert(sektorId, f, daten)) && !feldIstSensibel(f, sektorId));
    if (!sichtbar.length) continue;
    // Befund 1: <h2> statt <h3> — die bereich-kopf-Überschrift darüber ist jetzt <h1>.
    html += '<div class="sektion"><h2 class="sektion-titel">' + escapeHTML(sektion.label || '') + '</h2>';
    for (const f of sichtbar) {
      html += feldZeileHTML(sektorId, f, feldRohwert(sektorId, f, daten));
    }
    html += '</div>';
  }
  // U2-ADR-037: eingewanderte Template-Felder read-only ans Bereich-Ende spiegeln (gleicher Look
  // wie Kern-Felder; Wert aus dem geteilten Slot daten[feldId]; leere + unbekannte Typen übersprungen).
  for (const g of _tplAbschnitte(sektorId)) {
    /* A359 Bauweg 3: dieselbe Sensibel-Zurückhaltung wie oben für die Katalog-Felder —
       schema- ODER nutzer-sensibel, unbedingt, ohne Opt-in-Gegenstück. Ein angedocktes Feld
       hier zu zeigen, während das Kern-Feld daneben zurückgehalten wird, wäre eine
       Offenlegung durch die Hintertür. */
    const sichtbar = g.felder.filter(d => {
      const f = _tplDefAlsFeld(d);
      return feldEingetragen(f, daten[d.feldId]) && !feldIstSensibel(f, sektorId);
    });
    if (!sichtbar.length) continue;
    html += '<div class="sektion"><h2 class="sektion-titel">' + escapeHTML(g.label) + '</h2>';
    // A318 Zug 2c: die Herkunft dieser Felder, bevor sie gelesen werden — geprüft, abgelaufen,
    // nicht bestanden oder nicht prüfbar. Vor den Zeilen, weil sie sagt, wie sie zu lesen sind.
    html += vorlagenMarkeHTML(sichtbar);
    for (const d of sichtbar) html += feldZeileHTML(sektorId, _tplDefAlsFeld(d), daten[d.feldId]);
    html += '</div>';
  }
  // Falls gar nichts eingetragen ist
  if (!html.includes('feld-zeile')) html += '<p class="leer-bereich">' + escapeHTML(STRINGS.leerZustand) + '</p>';
  html += '</div>';
  return html;
}

function feldZeileHTML(sektorId, feld, roh) {
  // Listen-Felder ausführlicher zeigen (jeder Eintrag eine Unterzeile)
  if (feld.typ === 'liste' && Array.isArray(roh) && roh.length && Array.isArray(feld.unterFelder) && feld.unterFelder.length) {
    let inner = '<div class="feld-zeile feld-liste"><div class="feld-label">' + escapeHTML(feld.label) + '</div><div class="feld-wert">';
    inner += '<ul class="liste-eintraege">';

  // ref:mappe mit Bild → Thumbnail
  let wertHTML;
  if (feld.typ === 'ref' && (feld.entitaet === 'mappe') && roh && roh.ref) {

    if (m && /^image\//.test(m.mime || '') && /^data:/.test(m.inhalt || '')) {

    '<div class="feld-wert">' + wertHTML + '</div></div>' +
    urheberschaftZeileHTML(sektorId, feld.id);
}

  el('btn-qr-lesen').addEventListener('click', () => {

      (msg) => { const f = el('qr-fehler'); f.textContent = msg; f.hidden = false; });

// Verarbeitet einen QR-Inhalt: Mehr-Teile sammeln, sonst direkt Notfall-Klartext.
// onFund (optional, U2-ADR-082-Nachtrag): feuert GENAU dann, wenn die Sicht gleich wechselt
// (Fund komplett) — explizites Signal für Aufrufer, die währenddessen eine Ressource offen
// halten (z. B. die Kamera), statt das per DOM-Abfrage zu erraten.
function verarbeiteQrText(text, onFortschritt, onFehler, onFund) {
  const teil = qrTeilAufnehmen(text);
  if (teil && !teil.fertig) {
    const msg = STRINGS.qrTeilFortschritt
      .replace('{i}', teil.i).replace(/\{n\}/g, teil.n)
      .replace('{empfangen}', teil.empfangen).replace('{liste}', teil.fehlend.join(', '));
    onFortschritt && onFortschritt(msg);
    return;
  }
  const ganzText = teil && teil.fertig ? teil.text : text;
  const notfall = parseNotfallQrText(ganzText);
  if (notfall && notfall.zeilen.length) {
    onFund && onFund();
    notfallStufe1 = notfall; leseModus = 'notfall'; renderNotfall(); return;
  }
  // evtl. ein eingefügtes JSON (Datei-Inhalt als Text)
  try {
    const obj = JSON.parse(ganzText);
    onFund && onFund();
    verarbeiteDatei(obj); return;
  } catch (e) { /* kein JSON */ }
  onFehler && onFehler(STRINGS.qrUnlesbar);
}

/* ══ DIE ANTWORT ÖFFNEN UND ZEIGEN (Kette, Auftrag 8, Zug 2 und 3) ═════════════════════════
   Zwei Verfahren, EIN Schirm: das Verfahren steht im Umschlag, nicht in der Wahl des
   Empfängers. Wer hier wählen liesse, liesse falsch wählen. */
let antwortUmschlag = null;
function renderAntwortOeffnen(umschlag) {
  antwortUmschlag = umschlag;
  const wrap = el('app');
  setModusFarbe('anker');
  wrap.className = 'sheet-screen';
  const perPasswort = umschlag.verfahren === 'einmalpasswort';
  wrap.innerHTML =
    '<div class="sheet" role="main">' +
      '<h1>' + escapeHTML(STRINGS.antwortTitel) + '</h1>' +
      '<p class="hint" id="antwort-kopf">' +
        escapeHTML(STRINGS.antwortVorgang) + ' ' + escapeHTML(String(umschlag.vorgang || '—')) +
      '</p>' +
      '<p class="hint">' + escapeHTML(perPasswort ? STRINGS.antwortHintPasswort : STRINGS.antwortHintSchluessel) + '</p>' +
      (perPasswort
        ? '<form id="antwort-form" autocomplete="off">' +
            '<input type="password" id="antwort-pw" class="pw-feld" placeholder="' + escapeHTML(STRINGS.antwortPwPlaceholder) + '" autocomplete="off">' +
            '<div class="pw-fehler" id="antwort-fehler" hidden></div>' +
            '<div class="sheet-aktionen">' +
              '<button type="button" class="btn btn-sek" id="btn-zurueck">' + escapeHTML(STRINGS.zurueck) + '</button>' +
              '<button type="submit" class="btn">' + escapeHTML(STRINGS.pwOeffnen) + '</button>' +
            '</div>' +
          '</form>'
        : '<input type="file" id="antwort-key" accept=".json,.jwk,application/json">' +
          '<div class="pw-fehler" id="antwort-fehler" hidden></div>' +
          '<div class="sheet-aktionen">' +
            '<button type="button" class="btn btn-sek" id="btn-zurueck">' + escapeHTML(STRINGS.zurueck) + '</button>' +
          '</div>') +
    '</div>';
  el('btn-zurueck').addEventListener('click', () => { antwortUmschlag = null; renderWelcome(); });
  const fehler = (text) => { const f = el('antwort-fehler'); f.textContent = text; f.hidden = false; };
  if (perPasswort) {
    el('antwort-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = el('antwort-pw').value;
      try {
        const ds = await antwortEntschluesselnPasswort(umschlag, pw);
        el('antwort-pw').value = '';
        renderAntwort(ds, umschlag);
      } catch (err) { el('antwort-pw').value = ''; fehler(STRINGS.antwortFalsch); el('antwort-pw').focus(); }
    });
    const pf = el('antwort-pw'); if (pf && pf.focus) pf.focus();
  } else {
    el('antwort-key').addEventListener('change', (ev) => {
      const datei = ev && ev.target && ev.target.files && ev.target.files[0];
      if (!datei) return;
      const reader = new FileReader();
      reader.onload = async () => {
        let jwk;
        try { jwk = JSON.parse(String(reader.result)); }
        catch (e2) { fehler(STRINGS.antwortKeyUnlesbar); return; }
        try { renderAntwort(await antwortEntschluesselnSchluessel(umschlag, jwk), umschlag); }
        catch (e3) { fehler(STRINGS.antwortFalsch); }
      };
      reader.onerror = () => fehler(STRINGS.antwortKeyUnlesbar);
      reader.readAsText(datei);
    });
  }
}
/* Das Blatt. Es zeigt GENAU, was `antwortAnzeigeModell` hergibt — nicht mehr (es gibt kein
   Depot dahinter) und nicht weniger (die Aussagen über die Teilantwort sind das Wertvollste
   daran). Weitergeben als Datensatz: der Klartext, den die Bürgerin herausgegeben hat, als
   Datei — für die Fachanwendung der Institution. */
let antwortDatensatz = null;
function renderAntwort(datensatz, umschlag) {
  antwortDatensatz = datensatz;
  const m = antwortAnzeigeModell(datensatz, umschlag);
  const wrap = el('app');
  setModusFarbe('anker');
  wrap.className = 'sheet-screen';

      escapeHTML(STRINGS.antwortVorgang) + ' ' + escapeHTML(m.vorgang || '—') + '</p>' +
    '<p id="antwort-zweck"><strong>' + escapeHTML(STRINGS.antwortZweck) + '</strong> ' + escapeHTML(m.zweck || '—') + '</p>' +
    '<p id="antwort-grundlage"><strong>' + escapeHTML(STRINGS.antwortGrundlage) + '</strong> ' + escapeHTML(m.grundlage || '—') + '</p>';
  h += '<ul class="antwort-felder" id="antwort-felder">';
  for (const f of m.felder) {
    h += '<li data-antwort-feld="' + escapeHTML(f.label) + '"><strong>' + escapeHTML(f.label) + ':</strong> ' +
      escapeHTML(f.wert) +
      (f.zweck ? ' <span class="weg-hint">' + escapeHTML(STRINGS.antwortFeldZweck + ' ' + f.zweck) + '</span>' : '') +
      (f.gueltigBis ? ' <span class="weg-hint">' + escapeHTML(STRINGS.antwortGueltigBis + ' ' + String(f.gueltigBis).slice(0, 10)) + '</span>' : '') +
      '</li>';
  }
  h += '</ul>';
  /* DIE AUSSAGEN ÜBER SICH SELBST — ohne sie hielte der Empfänger fünf von neun Angaben für
     eine vollständige Auskunft. Das ist die teurere Hälfte dieses Blattes. */
  if (!m.vollstaendig) {
    h += '<div class="klartext-warn" id="antwort-teilantwort">' + escapeHTML(STRINGS.antwortTeilantwort) + '</div>';
  }
  if (m.fehlend.length) {
    h += '<p id="antwort-fehlend"><strong>' + escapeHTML(STRINGS.antwortFehlend) + '</strong> ' +
      escapeHTML(m.fehlend.map((f) => f.label + (f.pflicht ? '' : ' (' + STRINGS.antwortFreigestellt + ')')).join(', ')) + '</p>';
  }
  if (m.unbekannt.length) {
