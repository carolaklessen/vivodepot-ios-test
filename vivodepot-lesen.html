      escapeHTML(m.unbekannt.join(', ')) + '</p>';
  }
  if (m.zurueckgehalten) {
    h += '<p id="antwort-zurueckgehalten">' + escapeHTML(STRINGS.antwortZurueckgehalten.replace('{n}', String(m.zurueckgehalten))) + '</p>';
  }
  h += '<div class="sheet-aktionen">' +
    '<button type="button" class="btn btn-sek" id="btn-zurueck">' + escapeHTML(STRINGS.zurueck) + '</button>' +
    '<button type="button" class="btn" id="btn-antwort-weiter">' + escapeHTML(STRINGS.antwortWeitergeben) + '</button>' +
    '</div></div>';
  wrap.innerHTML = h;
  el('btn-zurueck').addEventListener('click', () => { antwortUmschlag = null; antwortDatensatz = null; renderWelcome(); });
  el('btn-antwort-weiter').addEventListener('click', () => antwortWeitergeben());
}
/* WEITERGEBEN als Datensatz — die Fachanwendung der Institution liest JSON, keinen Bildschirm.
   Kein Netz, kein Upload: eine Datei, die der Mensch selbst weiterreicht. */
function antwortWeitergeben() {
  if (!antwortDatensatz || typeof Blob !== 'function') return;
  const name = 'Vivodepot_Antwort_Klartext_'
    + String((antwortUmschlag && antwortUmschlag.vorgang) || 'Vorgang').replace(/[^\p{L}\p{N}_-]+/gu, '-') + '.json';
  const blob = new Blob([JSON.stringify(antwortDatensatz, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ══ DER KAMERA-PFAD, WIEDERAUFGENOMMEN (Kette, Auftrag 8 — U2-ADR-085 §5 Entscheidung 3) ══
   Er wurde am 14.07.2026 entfernt, weil seine einzige Begründung (zwei QR-Nutzlastformen)
   entfallen war — „toter Code MIT GERÄTE-BERECHTIGUNG, eine eigene Klasse". Er kommt mit
   diesem Auftrag zurück, und der Grund ist eine Auflage, keine Bequemlichkeit: die
   Geräte-Probe verlangt, dass ein QR mit einer GEWÖHNLICHEN Handykamera gelesen wird — am
   Bildschirm, auf Papier, bei Tageslicht. Was am Rechner grün ist und am Tresen nicht
   funktioniert, ist nicht fertig.

   DREI GRENZEN, damit die Geräte-Berechtigung nicht mehr kostet, als sie trägt:
     · Die Kamera wird NUR auf ausdrücklichen Klick geöffnet, nie beim Laden der Seite.
     · Sie wird beim ersten vollständigen Fund und bei jedem Verlassen SOFORT geschlossen —
       eine Kamera, die weiterläuft, ist ein offenes Mikroskop auf dem Schreibtisch.
     · Fehlt der Browser-Leser (`BarcodeDetector`) oder verweigert der Mensch den Zugriff,
       wird das GESAGT und der Einfüge-Weg bleibt — kein Nachladen aus dem Netz, nie. */
let kameraStrom = null;
let kameraLaeuft = false;
function kameraStoppen() {
  kameraLaeuft = false;
  try { if (kameraStrom) kameraStrom.getTracks().forEach((t) => t.stop()); } catch (e) { /* egal */ }
  kameraStrom = null;
}
function kameraMoeglich() {
  return !!(typeof navigator !== 'undefined' && navigator.mediaDevices
    && typeof navigator.mediaDevices.getUserMedia === 'function');
}
function kameraLeserMoeglich() { return typeof BarcodeDetector !== 'undefined'; }
function renderKamera() {
  const wrap = el('app');
  setModusFarbe('anker');
  wrap.className = 'sheet-screen';
  wrap.innerHTML =
    '<div class="sheet" role="main">' +
      '<h1>' + escapeHTML(STRINGS.kameraTitel) + '</h1>' +
      '<p class="hint" id="kamera-hint">' + escapeHTML(STRINGS.kameraSucht) + '</p>' +
      '<video id="kamera-video" playsinline muted style="width:100%;max-width:480px;border-radius:8px"></video>' +
      '<div class="pw-fehler" id="kamera-fehler" hidden></div>' +
      '<div id="kamera-fortschritt" class="qr-fortschritt" hidden></div>' +
      '<div class="sheet-aktionen">' +
        '<button type="button" class="btn btn-sek" id="btn-zurueck">' + escapeHTML(STRINGS.zurueck) + '</button>' +
        '<button type="button" class="btn" id="btn-kamera-start">' + escapeHTML(STRINGS.kameraStarten) + '</button>' +
      '</div>' +
    '</div>';
  el('btn-zurueck').addEventListener('click', () => { kameraStoppen(); qrTeile.clear(); renderWelcome(); });
  const fehler = (t) => { const f = el('kamera-fehler'); f.textContent = t; f.hidden = false; };
  el('btn-kamera-start').addEventListener('click', async () => {
    if (!kameraMoeglich()) { fehler(STRINGS.kameraFehlt); return; }
    if (!kameraLeserMoeglich()) { fehler(STRINGS.kameraKeinLeser); return; }
    let strom;
    try { strom = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); }
    catch (e) { fehler(STRINGS.kameraAbgelehnt); return; }
    kameraStrom = strom; kameraLaeuft = true;
    const video = el('kamera-video');
    video.srcObject = strom;
    try { await video.play(); } catch (e) { /* Autoplay-Politik — der Rahmen bleibt trotzdem stehen */ }
    const leser = new BarcodeDetector({ formats: ['qr_code'] });
    const schleife = async () => {
      if (!kameraLaeuft) return;
      try {
        const treffer = await leser.detect(video);
        for (const t of treffer) {
          verarbeiteQrText(String(t.rawValue || ''),
            (msg) => { const f = el('kamera-fortschritt'); if (f) { f.textContent = msg; f.hidden = false; } },
            (msg) => fehler(msg),
            () => kameraStoppen());          // Fund komplett → Kamera SOFORT zu
          if (!kameraLaeuft) return;
        }
      } catch (e) { /* ein einzelner Bildfehler beendet den Scan nicht */ }
      if (kameraLaeuft) setTimeout(schleife, 250);
    };
    schleife();
  });
}

/* ── Hinweis / Fehler / Schließen ─────────────────────────────────────────── */
function renderHinweisMitZurueck(text) {
  const wrap = el('app');
  setModusFarbe('anker');
  wrap.className = 'sheet-screen';
  wrap.innerHTML = '<div class="sheet"><p class="hint">' + escapeHTML(text) + '</p>' +
    '<div class="sheet-aktionen"><button class="btn btn-sek" id="btn-zurueck">' + escapeHTML(STRINGS.zurueck) + '</button></div></div>';
  el('btn-zurueck').addEventListener('click', renderWelcome);
}
function renderFehler(text) { renderHinweisMitZurueck(text); }

function onSchliessen() {
  // entladen() nimmt keine Parameter — frühere Aufrufe hier und beim Zurück-Knopf übergaben
  // entladen(true)/entladen(false), die die Funktion nie las (CC-Auftrag Eingangsschirm,
  // 20.07.2026). Sofortiges Abräumen bleibt hier bewusst zusätzlich zur zentralen Prüfung in
  // renderWelcome() stehen — früher als das erst beim Klick auf „Neu".
  entladen();
  const wrap = el('app');
  setModusFarbe('anker');
  wrap.className = 'sheet-screen';
  wrap.innerHTML = '<div class="sheet"><p class="hint">' + escapeHTML(STRINGS.schliessenHinweis) + '</p>' +
    '<div class="sheet-aktionen"><button class="btn" id="btn-neu">' + escapeHTML(STRINGS.zurueck) + '</button></div></div>';
  el('btn-neu').addEventListener('click', renderWelcome);
}

// F-6 — alles aus dem RAM entladen. Es gibt nichts zu persistieren (kein Storage),
// daher genügt das Nullen der Modul-Referenzen; GC räumt den Rest.
function entladen() {
  data = null;
  /* Glied 8: die angedockten Register gehen MIT dem Depot. Ein Satz, der nach dem Schliessen
     stehen bliebe, spräche auf der Startseite weiter — und beim nächsten Depot bis zum ersten
     Öffnen. Die Anmeldung ist an das offene Depot gebunden, nicht an die Sitzung. */
  _TEXTSATZ_MODUL_REGISTRY = Object.create(null);
  _TEXTSATZ_MODUL_SPRACHE = null;
  _RECHTSRAUM_MODUL_REGISTRY = Object.create(null);
  /* A318 Zug 2: derselbe Grund wie eine Zeile darüber — ein Prüfstand, der nach dem
     Schliessen stehen bliebe, markierte die Felder des NÄCHSTEN Depots mit dem Urteil
     über das vorige. */
  vorlagenStandZuruecksetzen();
  leseModus = 'anker';
  subInfo = null;
  klartextWarnung = false;
  notfallStufe1 = null;
  qrTeile.clear();
  aktiverSektorId = null;
  // best effort: Session-Schlüssel-Globals des VdCrypto-Blocks nullen, falls vorhanden
  try { if (typeof sessionHkdfKey !== 'undefined') sessionHkdfKey = null; } catch (e) {}
}

/* ── Boot ─────────────────────────────────────────────────────────────────── */
function boot() {
  // Defensive: niemals persistente Speicher anfassen. (Es gibt im Code keinen Zugriff;
  // dieser Block dokumentiert die Invariante und ist ein no-op.)
  renderWelcome();
}
if (typeof document !== 'undefined' && document.addEventListener) {
  document.addEventListener('DOMContentLoaded', boot);
}
</script>
